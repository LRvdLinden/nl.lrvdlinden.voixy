name: Deploy Voxie backend

on:
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - '.github/workflows/deploy-supabase.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: voxie-supabase-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: qalcgyzkicazkmzsouiu
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Require deployment credentials
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Missing SUPABASE_ACCESS_TOKEN secret'; exit 1; }
          test -n "$SUPABASE_DB_PASSWORD" || { echo 'Missing SUPABASE_DB_PASSWORD secret'; exit 1; }
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Apply additive database migrations
        run: supabase db push --yes
      - name: Configure Apple Push to Talk credentials
        env:
          APNS_AUTH_KEY_P8: ${{ secrets.APNS_AUTH_KEY_P8 }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_ENVIRONMENT: ${{ vars.APNS_ENVIRONMENT || 'production' }}
        run: |
          if [ -n "$APNS_AUTH_KEY_P8" ] && [ -n "$APNS_KEY_ID" ] && [ -n "$APNS_TEAM_ID" ]; then
            supabase secrets set --project-ref "$PROJECT_REF" \
              APNS_AUTH_KEY_P8="$APNS_AUTH_KEY_P8" \
              APNS_KEY_ID="$APNS_KEY_ID" \
              APNS_TEAM_ID="$APNS_TEAM_ID" \
              APNS_ENVIRONMENT="$APNS_ENVIRONMENT"
          else
            echo 'Apple APNs secrets missing; background wake will remain unavailable.'
          fi
      - name: Deploy Voxie Edge Function
        run: supabase functions deploy voxie --project-ref "$PROJECT_REF" --no-verify-jwt
